    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/work_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-digitaloffice}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/digital-office}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/digital-office/protocol/openid-connect/certs
      ORGANIZATION_SERVICE_URL: http://organization-service:8082
      PROJECT_SERVICE_URL: http://project-service:8084
      DOCUMENT_SERVICE_URL: http://document-service:8086
    depends_on: {postgres: {condition: service_healthy}, keycloak: {condition: service_started}}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
