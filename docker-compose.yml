      INTERNAL_DOCUMENT_SERVICE_URL: http://document-service:8086
      INTERNAL_PROJECT_SERVICE_URL: http://project-service:8084
      INTERNAL_NOTIFICATION_SERVICE_URL: http://notification-service:8087
