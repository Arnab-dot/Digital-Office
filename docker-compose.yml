      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/digital-office}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/digital-office/protocol/openid-connect/certs
      JITSI_SERVER_URL: ${JITSI_SERVER_URL:-https://meet.jit.si}
    depends_on: {postgres: {condition: service_healthy}, keycloak: {condition: service_started}}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/actuator/health || exit 1"]
