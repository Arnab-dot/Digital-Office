  api-gateway:
    build: services/api-gateway
    ports: ["8088:8088"]
    environment:
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/digital-office}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/digital-office/protocol/openid-connect/certs
      IDENTITY_SERVICE_URL: http://identity-service:8081
      ORGANIZATION_SERVICE_URL: http://organization-service:8082
      CLIENT_SERVICE_URL: http://client-service:8083
      PROJECT_SERVICE_URL: http://project-service:8084
      WORK_SERVICE_URL: http://work-service:8085
      DOCUMENT_SERVICE_URL: http://document-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      DASHBOARD_SERVICE_URL: http://dashboard-service:8089
      COMMUNICATION_SERVICE_URL: http://communication-service:8090
      FINANCE_SERVICE_URL: http://finance-service:8091
    depends_on:
      - service-discovery
      - identity-service
      - organization-service
      - client-service
      - project-service
      - work-service
      - document-service
      - notification-service
      - dashboard-service
      - communication-service
      - finance-service
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: frontend
    ports: ["5173:80"]
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  minio_data:
