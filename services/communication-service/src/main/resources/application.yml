server:
  port: 8090
spring:
  application:
    name: communication-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/communication_db}
    username: ${SPRING_DATASOURCE_USERNAME:digitaloffice}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-locally}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/digital-office}

jitsi:
  server-url: ${JITSI_SERVER_URL:https://meet.jit.si}
  app-id: ${JITSI_APP_ID:}
  app-secret: ${JITSI_APP_SECRET:}

internal:
  organization-service:
    url: ${ORGANIZATION_SERVICE_URL:http://localhost:8082}
  project-service:
    url: ${PROJECT_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
